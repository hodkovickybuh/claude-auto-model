name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CA_CLAUDE_BIN: /no-paid-inference-in-ci
      CA_STOCK_FUNCTION: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_AUTH_TOKEN: ''
      CLAUDE_CODE_OAUTH_TOKEN: ''
    steps:
      # Official release: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Official release: https://github.com/actions/setup-python/releases/tag/v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install zsh on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check zsh syntax
        run: zsh -n claude-auto-model.zsh
      - name: Offline unit tests
        run: python -m unittest discover -v
      - name: Validate fixed evaluation corpus offline
        run: python eval_routing.py
